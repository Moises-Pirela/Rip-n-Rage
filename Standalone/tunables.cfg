# Rip-n-Rage post-processing tunables.
# The file is watched while the game runs: save it and the new values apply within half a second.
# Booleans: true/false. Colours: r,g,b (0..1). Lines starting with # or ; are comments.

[postfx]
enabled = true          # master switch (F4 toggles at runtime too)
render_scale = 1.0      # 3D scene resolution relative to the window (0.25..1). Software GL (this VM): try 0.6
bloom_scale = 0.25      # resolution of the bloom buffers (0.125..1); lower = cheaper and softer
hdr = false             # RGBA16F targets; only needed for HDR content, slower on software renderers

[camera]                    # world camera (the game sets 77 / 0.05 / 2000; 0 = keep the game's value)
fov = 0                     # vertical field of view in degrees (e.g. 90 for a wider world view without touching the weapon)
near = 0
far = 0

[viewmodel]                 # first-person weapon / hands: own render pass + projection, drawn after the world post-fx
enabled = true              # false hides the weapon layer entirely
fov = 77                    # viewmodel FOV, independent of [camera] fov (lower = bigger weapon)
near = 0.02                 # own depth range: the weapon never clips into walls
far = 50
lit = true                  # light the weapon with the sun / point lights / muzzle flash instead of full-bright
wrap = 0.85                 # diffuse wrap for the viewmodel lighting (0 = hard, 1 = very soft)
exposure = 1.15             # brightness multiplier for the lit viewmodel

[culling]                   # visibility: applied to world meshes, sprites and point lights (shadow casters are never culled)
frustum = true              # skip renderers whose bounds are outside the camera frustum
occlusion = gpu             # gpu = hardware occlusion queries against the depth buffer (default), cpu = legacy software rasterizer, off
buffer_width = 192          # cpu mode only: occlusion buffer size (bigger = more precise, slower)
buffer_height = 96
lights = true               # cull point lights whose range sphere is off screen / hidden
debug_view = false          # draw the occlusion depth buffer + counters in the bottom-right corner

[bloom]
enabled = true
threshold = 0.80        # brightness where bloom starts (0..1 for LDR content)
soft_knee = 0.5         # 0 = hard cut at the threshold, 1 = very gradual
intensity = 0.70        # strength added back to the image
radius = 1.0            # blur spread of one pass (in half-res texels)
passes = 3              # more passes = wider, softer glow (1..8)

[chromatic_aberration]
enabled = true
intensity = 0.5         # 1.0 ≈ 1.2% of the screen width of RGB separation at the edges
radial = true           # true = grows towards the screen edges (lens-like), false = constant horizontal shift

[vignette]
enabled = true
intensity = 0.35        # 0 = off, 1 = fully dark corners
smoothness = 0.5        # falloff width (0.01..1)
roundness = 1.0         # 1 = circular, 0 = follows the screen shape
color = 0, 0, 0         # tint of the darkened edge

[motion_blur]
enabled = true
intensity = 0.6         # scales the per-pixel camera velocity
samples = 6             # taps along the velocity (2..32)
max_velocity = 0.04     # clamp, in screen fractions, to avoid smearing on fast turns

[color]
exposure = 1.0
saturation = 1.0
contrast = 1.0

# ---------------------------------------------------------------- lighting & atmosphere

[lighting]
sun_elevation = 28          # degrees above the horizon (low = long shadows, strong light shafts)
sun_azimuth = 35            # degrees; rotates the sun around the up axis
sun_color = 1.0, 0.93, 0.80
sun_intensity = 1.15
ambient_sky = 0.42, 0.50, 0.64    # hemisphere ambient from above
ambient_ground = 0.30, 0.25, 0.20 # hemisphere ambient from below
specular = 0.25             # Blinn-Phong highlight strength on meshes
sprite_wrap = 0.6           # wrapped lighting for billboard sprites (0 = hard lambert, 1 = no directional shading)
max_point_lights = 16       # nearest point lights gathered per frame (0..16)
lights_per_draw = 6         # of those, only the lights whose range touches an object are uploaded for its draw (0 = upload all, per pixel)

[sky]
zenith = 0.18, 0.38, 0.76
horizon = 0.78, 0.80, 0.84
ground = 0.20, 0.22, 0.25

[fog]                       # classic distance fog in the surface shaders
enabled = true
color = 0.70, 0.76, 0.84
start = 150
end = 700

[shadows]
enabled = true
resolution = 2048           # shadow map size; the static geometry is cached, so 2048 costs almost nothing per frame
distance = 70               # half-size of the shadowed area around the camera (world units)
bias = 0.0015               # depth bias (raise if you see acne, lower if shadows detach)
normal_offset = 0.05        # pushes the lookup along the surface normal (also fights acne)
softness = 1.0              # 0 = one hardware-PCF fetch (already bilinear), > 0 = four fetches spread by this many texels
sprite_shadows = true       # enemies / pickups cast shadows too (drawn every frame on top of the cached static depth)
cache = true                # render the static casters only when the box re-centres or a mesh moves
recenter = 0.3              # fraction of 'distance' the camera may drift before the box re-centres (re-renders the static casters)

[volumetric_fog]
enabled = true
density = 0.0035            # extinction per unit at ground level
height = 2.0                # height (world y) of full density
height_falloff = 0.12       # how fast density fades with altitude above 'height'
color = 0.80, 0.85, 0.95    # fog albedo
sun_scattering = 1.0        # strength of sunlight scattered towards the camera (light shafts)
anisotropy = 0.55           # Henyey-Greenstein g: 0 = even glow, 0.9 = tight forward shafts when looking at the sun
ambient = 0.25              # ambient sky light scattered by the fog
steps = 10                  # shadow samples per pixel along the ray (only the light shafts are marched; density, ambient and point-light glow are analytic)
max_distance = 300          # how far the march goes
shadows = true              # sample the shadow map for god rays (without it the sun term is analytic too: no march at all)
point_lights = true         # point lights glow in the fog (closed form, no per-step cost)
scale = 0.35                # march resolution relative to the scene (0.25..0.5; the bilateral upsample hides the low resolution)
upsample = true             # depth-aware upsampling of the fog buffer (no halos at depth edges); false = plain bilinear
dither = 1.0                # per-pixel jitter hiding step banding

# ---------------------------------------------------------------- materials
# [material.<name>] retunes a material registered in code (MaterialLibrary) while the game runs.
# Keys: shader = <shaders/*.glsl name>, blend = opaque|alphablend|additive|multiply, cull = back|front|off,
#       queue = <int>, depth_write = true|false, alpha_cutoff = <float>, or any shader property:
#       one number -> float, "x, y" -> vec2, "r, g, b[, a]" -> colour, "tex:<path under Assets/ or shaders/>" -> texture.

[material.water]
_WaveAmplitude = 0.15
_WaveLength = 18
_WaveSpeed = 1.2
_Tiling = 0.05
_ScrollSpeed = 0.03
_NormalStrength = 0.6
_ShallowColor = 0.45, 0.80, 0.95
_DeepColor = 0.05, 0.25, 0.45
_Fresnel = 1.0
_Opacity = 0.82
_Specular = 1.5

[material.lamp]
_PulseSpeed = 2.5
_PulseMin = 0.9
_PulseMax = 1.6
_EmissiveColor = 1.0, 0.82, 0.5

[material.enemy_dissolve]
_EdgeWidth = 0.08
_NoiseScale = 24
_EdgeColor = 1.0, 0.45, 0.1

[material.crate]
uTint = 0.9, 0.9, 0.9

# ---------------------------------------------------------------------------------------------------------------
# Physics. Every global knob of the simulation; the level editor's physics panel (F9) edits and saves these, a
# running game reloads them within half a second. Per-object values (a body's mass, a collider's size) are not here.

[physics]
tick_rate = 50              # fixed physics steps per second (Time.fixedDeltaTime = 1 / tick_rate)
max_steps_per_frame = 8     # fixed steps one frame may run before the simulation falls behind real time
max_frame_delta = 0.1       # seconds a single frame may simulate at most (hitches slow the game instead of skipping)
gravity = 0, -9.81, 0       # m/s²

[collision]
contact_margin = 0.01       # shapes closer than this count as touching (keeps resting contacts alive)
skin = 0.01                 # gap sweeps keep between a mover and what it stops at
broadphase_cell = 8         # static collider grid cell size (m)
ccd_skin = 0.003            # stop distance of continuous collision sweeps
max_body_speed = 80         # rigid bodies are clamped to this (m/s)
max_body_angular_speed = 40 # rad/s
sleep_threshold = 0.08      # bodies slower than this (m/s, rad/s) for sleep_delay seconds fall asleep
sleep_delay = 0.6           # seconds

[solver]
substeps = 4                    # substeps per fixed step (more = stiffer stacks, slower)
threads = 0                     # rigid solver worker threads: 0 = one per core (max 16), 1 = single-threaded
velocity_iterations = 1         # biased velocity passes per substep
relax_iterations = 1            # unbiased (relax) passes per substep; removes the energy the bias adds
position_iterations = 2         # position passes per substep (NGS mode only)
position_correction = Soft      # Soft (spring contacts, default) | Baumgarte (velocity bias) | NGS (position passes)
warm_starting = true            # carry contact / joint impulses over from the previous step (false = cold start)
contact_cache_lifetime = 3      # steps a manifold's impulses survive a brief separation
friction_model = StaticDynamic  # StaticDynamic (stick up to μs·N, slide at μd·N) | Coulomb (μd only)
slip_speed = 0.05               # tangential speed (m/s) below which a contact sticks with static friction instead of sliding
contact_hertz = 30              # Soft mode: contact spring stiffness (capped at a quarter of the substep rate)
contact_damping = 10            # Soft mode: contact spring damping ratio
baumgarte = 0.2                 # Baumgarte / NGS: fraction of the penetration corrected per substep
linear_slop = 0.005             # penetration tolerated without correction (m)
angular_slop = 2                # joint angle error tolerated without correction (degrees)
max_linear_correction = 0.2     # NGS: largest position push per pass (m)
max_bias_velocity = 4           # fastest penetration recovery (m/s)
restitution_threshold = 1       # approach speed above which things bounce
static_friction = 0.6           # static friction of level geometry and movers (colliders without a material)
dynamic_friction = 0.5          # sliding friction of level geometry and movers
static_restitution = 0          # bounciness of level geometry and movers
friction_combine = Average      # how two surfaces' friction combines when neither has a material: Average | Minimum | Maximum | Multiply
restitution_combine = Maximum   # same for bounciness
joint_hertz = 60                # Soft mode: joint stiffness (ragdolls, hinges, welds)
joint_damping = 2               # Soft mode: joint damping ratio

[movers]                    # kinematic movers (projectiles, legacy CharacterController / KinematicBody, nav agents without a body)
floor_max_angle = 46        # steepest surface that is a floor (degrees)
max_slides = 5              # slide iterations per move
agent_step_height = 0.4     # nav agents: highest ledge stepped up
agent_slope_limit = 50      # nav agents: steepest walkable slope
push_mass = 80              # kinematic characters push rigid bodies as if they weighed this much

[character]                 # the player's force-driven body (CharacterBody, profile Player)
mass = 80                   # kg
ride_height = 0.5           # gap the capsule floats above the ground (ledges below it are climbed for free)
ride_frequency = 6          # ride spring stiffness (Hz)
ride_damping = 0.8          # ride spring damping ratio (1 = critical)
max_ride_acceleration = 90  # m/s² the spring may apply at most
ground_tolerance = 0.25     # how far below the ride height the ground still counts (stairs down)
max_slope = 50              # steepest standable slope (degrees)
acceleration = 70           # ground acceleration towards the wanted velocity (m/s²)
air_acceleration = 20       # air control (m/s²)
stop_deceleration = 60      # deceleration with no input (m/s²)
jump_grace = 0.25           # seconds the spring lets go after a jump

[enemy_character]           # the enemies' force-driven bodies (profile Enemy)
mass = 85
ride_height = 0.35
ride_frequency = 6
ride_damping = 0.8
max_ride_acceleration = 90
ground_tolerance = 0.25
max_slope = 50
acceleration = 40
air_acceleration = 8
stop_deceleration = 40
jump_grace = 0.25

[movement]                  # the player's locomotion (FPSController); the prefab values are the defaults
walk_speed = 12             # m/s
run_speed = 16              # m/s (the default ground speed)
bunny_hop = true            # airborne speed switches to bunny_hop_speed
bunny_hop_speed = 30        # m/s while airborne
jump_speed = 20             # m/s upwards
gravity_multiplier = 2.5    # player gravity relative to [physics] gravity
backwards_percent = 1       # speed when moving backwards (0..1)
side_percent = 1            # speed when strafing (0..1)
smooth_input = 5            # input smoothing (higher = snappier)
smooth_velocity = 5         # speed smoothing
smooth_direction = 5        # direction smoothing
slide = true                # crouch while running to slide
slide_boost = 7             # m/s added when a slide starts
slide_friction = 7          # m/s² lost while sliding
slide_min_speed = 5         # slide ends below this
slide_start_speed = 6       # speed needed to start
slide_height = 1            # capsule height while sliding
slide_camera_drop = 0.55    # camera drop while sliding
slide_cooldown = 0.35       # seconds
slide_steer = 1.5           # how much left/right bends the slide
wall_run = true             # run along walls while airborne
wall_run_time = 1.6         # seconds
wall_run_gravity = 0.2      # gravity fraction on the wall
wall_run_speed = 13         # m/s
wall_check_distance = 0.75  # wall probe beyond the capsule radius
wall_jump_up = 15           # m/s
wall_jump_away = 11         # m/s
wall_run_tilt = 14          # camera roll degrees
wall_run_entry_boost = 3    # upward nudge when catching a wall
dash = true                 # dash on the dash key
dash_speed = 26             # m/s
dash_duration = 0.16        # seconds
dash_cooldown = 0.7         # seconds
air_dashes = 1              # dashes allowed per jump
